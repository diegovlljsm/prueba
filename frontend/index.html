<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070f18" />
    <meta name="description" content="La red de spots urbanos para deporte. Encuentra dónde entrenar, sube los tuyos y descubre lo que la comunidad ya validó." />

    <title>urbanFlow · Red de spots</title>

    <!-- Con un icono declarado, el navegador deja de pedir /favicon.ico a ciegas
         (era el 404 que aparecía en consola en cada carga). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- index.css declara Inter y JetBrains Mono como fuentes del tema, pero
         nadie las cargaba: la app entera estaba cayendo a la fuente del
         sistema. Estas dos líneas son las que hacen que se vea como se diseñó. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
