<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#070f18" />
    <meta name="robots" content="noindex" />
    <title>Spot no encontrado · urbanFlow</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* Mismos tokens que src/index.css: si allí cambia la paleta, cambia aquí.
         Esta página es estática a propósito — la sirve el servidor antes de que
         React arranque, así que no puede importar nada del bundle. */
      :root {
        --bg: #070f18;
        --card: #131b24;
        --borde: #2a343e;
        --accent: #baf413;
        --texto: #f2f5f7;
        --tenue: #8a97a6;
      }

      * { box-sizing: border-box; }

      html, body { height: 100%; }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--texto);
        font-family: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 24px;
        position: relative;
        overflow: hidden;
      }

      /* Rejilla de mapa de fondo, desvanecida hacia los bordes. */
      body::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          repeating-linear-gradient(0deg, rgba(186, 244, 19, 0.07) 0 1px, transparent 1px 48px),
          repeating-linear-gradient(90deg, rgba(186, 244, 19, 0.07) 0 1px, transparent 1px 48px);
        mask-image: radial-gradient(75% 60% at 50% 45%, #000 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(75% 60% at 50% 45%, #000 0%, transparent 75%);
        pointer-events: none;
      }

      main {
        position: relative;
        max-width: 560px;
        width: 100%;
        text-align: center;
      }

      .marca {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        margin-bottom: 40px;
      }

      .marca img { width: 34px; height: 34px; display: block; }

      .marca span {
        font-weight: 800;
        font-size: 17px;
        letter-spacing: -0.01em;
      }

      .marca span em {
        font-style: normal;
        color: var(--accent);
      }

      .codigo {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, monospace;
        font-size: clamp(84px, 22vw, 168px);
        font-weight: 700;
        line-height: 0.85;
        letter-spacing: -0.05em;
        color: var(--accent);
        margin: 0;
        text-shadow: 0 0 60px rgba(186, 244, 19, 0.28);
      }

      .etiqueta {
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 11px;
        font-weight: 500;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: var(--tenue);
        margin: 20px 0 0;
      }

      h1 {
        font-size: clamp(24px, 5vw, 32px);
        font-weight: 800;
        letter-spacing: -0.02em;
        margin: 14px 0 0;
        text-wrap: balance;
      }

      p.texto {
        color: var(--tenue);
        font-size: 16px;
        line-height: 1.6;
        margin: 14px auto 0;
        max-width: 42ch;
      }

      .acciones {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: center;
        margin-top: 36px;
      }

      a.boton {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 14px 26px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 15px;
        text-decoration: none;
        transition: transform 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
      }

      a.principal {
        background: var(--accent);
        color: #0a0f1c;
      }

      a.principal:hover { transform: translateY(-2px); background: #cbf95a; }

      a.secundario {
        background: var(--card);
        color: var(--texto);
        border: 1px solid var(--borde);
      }

      a.secundario:hover { transform: translateY(-2px); border-color: var(--accent); }

      a.boton:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }

      .ruta {
        margin-top: 34px;
        font-family: "JetBrains Mono", ui-monospace, monospace;
        font-size: 12px;
        color: #6b7885;
        word-break: break-all;
      }

      .ruta b {
        color: var(--tenue);
        font-weight: 500;
      }

      @media (prefers-reduced-motion: reduce) {
        a.boton { transition: none; }
        a.boton:hover { transform: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="marca">
        <img src="/favicon.svg" alt="" />
        <span>URBAN<em>FLOW</em></span>
      </div>

      <p class="codigo">404</p>
      <p class="etiqueta">Spot no encontrado</p>

      <h1>Esta dirección no está en el mapa</h1>
      <p class="texto">
        El enlace que seguiste no lleva a ningún sitio. Puede que el spot se
        haya retirado, o que la dirección esté mal escrita.
      </p>

      <div class="acciones">
        <a class="boton principal" href="/">Volver al mapa</a>
        <a class="boton secundario" href="/">Explorar spots cercanos</a>
      </div>

      <p class="ruta">Ruta solicitada: <b id="ruta">—</b></p>
    </main>

    <script>
      // Mostrar qué se pidió ayuda a distinguir un enlace roto de un error
      // nuestro. textContent, nunca innerHTML: la URL la controla quien entra.
      document.getElementById("ruta").textContent =
        window.location.pathname + window.location.search;
    </script>
  </body>
</html>
